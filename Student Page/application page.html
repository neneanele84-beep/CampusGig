<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusGig | Job Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="student.css">
</head>
<body class="application-page">
    <nav>
        <div class="logo-container">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <h1>CampusGig</h1>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="application-card">
            <div class="selected-gig-banner" id="selected-gig-banner">
                <span class="selected-gig-label">Viewing gig:</span>
                <span id="selected-gig-title"></span>
            </div>
            <h2>Job Application Form</h2>
            <p id="profile-prefill-message" role="status" aria-live="polite"></p>
            <form class="application-form" id="application-form">
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="firstName" placeholder="First Name" title="Enter your first name." required>

                <label for="surname">Surname:</label>
                <input type="text" id="surname" name="surname" placeholder="Surname" title="Enter your surname." required>
                <input type="hidden" id="name" name="name">

                <label for="date-of-birth">Date of Birth:</label>
                <input type="date" id="date-of-birth" name="dateOfBirth" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter phone number" inputmode="numeric" maxlength="16" required>
                <div class="error-message" id="phone-error" style="color: red; display: none;">Phone number must be in South African format: +27 XX XXX XXXX (9 digits after +27).</div>
                <br>

                <label for="house-number">House/Street Number:</label>
                <input type="text" id="house-number" name="houseNumber" placeholder="12A" required>

                <label for="street-name">Street Name:</label>
                <input type="text" id="street-name" name="streetName" placeholder="Main Road" required>

                <label for="suburb">Suburb:</label>
                <input type="text" id="suburb" name="suburb" placeholder="Mzingazi" required>

                <label for="city-town">City/Town:</label>
                <select id="city-town" name="cityTown" required>
                    <option value="">Select city/town</option>
                    <option value="Empangeni">Empangeni</option>
                    <option value="Richards Bay">Richards Bay</option>
                    <option value="Esikhaleni">Esikhaleni</option>
                    <option value="Ngwelezane">Ngwelezane</option>
                    <option value="Nseleni">Nseleni</option>
                    <option value="Felixton">Felixton</option>
                    <option value="KwaMbonambi">KwaMbonambi</option>
                    <option value="Other nearby area">Other nearby area</option>
                </select>
                <label for="other-area" id="other-area-label" hidden>Other nearby area:</label>
                <input type="text" id="other-area" name="otherArea" placeholder="Enter your nearby area" hidden>

                <label for="province">Province:</label>
                <input type="text" id="province" name="province" value="KwaZulu-Natal" readonly required>

                <label for="postal-code">Postal Code:</label>
                <input type="text" id="postal-code" name="postalCode" placeholder="3900" inputmode="numeric" maxlength="4" pattern="\d{4}" title="Postal code must be exactly 4 numbers." required>

                <label for="country">Country:</label>
                <input type="text" id="country" name="country" value="South Africa" readonly required>

                <label for="age">Age:</label>
                            <input type="number" id="age" name="age" min="17" inputmode="numeric" required>
                            <div class="error-message" id="age-error" style="color: red; display: none;">Applicants must be at least 17 years old.</div>
                <br>

                <label for="Gender">Gender:</label>
                <input type="text" id="Gender" name="Gender" required>
                <br>

                <label for="University">University:</label>
                <input type="text" id="University" name="University" required>
                <br>

                <label for="current-position">Current Position Applying For:</label>
                <input type="text" id="current-position" name="currentPosition" pattern="[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ' -]*" title="Job title must contain letters and spaces only." required readonly>

                <label for="language">Languages:</label>
                <input type="text" id="language" name="language" placeholder="e.g. English, Afrikaans" pattern="[A-Za-zÀ-ÖØ-öø-ÿ, -]+" title="Languages can only contain letters, spaces, commas, and hyphens." required>

                <label for="skill-input">Skills:</label>
                <div id="skill-input-container">
                    <input type="text" id="skill-input" placeholder="Enter a skill and press Enter" pattern="[A-Za-zÀ-ÖØ-öø-ÿ' -]+" title="Skills must contain letters and spaces only."> 
                </div> 
                <input type="hidden" id="skill-hidden-field" name="skills" required>

                <label for="availability-note">NB: For Availability</label>
                <textarea id="availability-note" name="availabilityNote" placeholder="Tell us your available days/times for this role." required></textarea>

                <input type="submit" value="Submit Application">
            </form>
        </div>
    </div>
<script>
  const input = document.getElementById('skill-input');
  const container = document.getElementById('skill-input-container');
  const hiddenField = document.getElementById('skill-hidden-field');
  let skills = [];

  function renderSkills() {
    container.querySelectorAll('.skill-tag').forEach(tag => tag.remove());

    skills.forEach((skill, index) => {
      const tag = document.createElement('span');
      tag.className = 'skill-tag';
      tag.innerHTML = `${skill} <button type="button" data-index="${index}">&times;</button>`;
      container.insertBefore(tag, input);
    });

    hiddenField.value = skills.join(',');
  }

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const value = input.value.trim();
      if (value && !skills.includes(value)) {
        skills.push(value);
        renderSkills();
      }
      input.value = '';
    } else if (e.key === 'Backspace' && input.value === '' && skills.length > 0) {
      skills.pop();
      renderSkills();
    }
  });

  container.addEventListener('click', function(e) {
    if (e.target.tagName === 'BUTTON') {
      const index = parseInt(e.target.getAttribute('data-index'));
      skills.splice(index, 1);
      renderSkills();
    }
  });

  const selectedGig = JSON.parse(localStorage.getItem('campusgig-selected-job') || '{}');
  const selectedGigBanner = document.getElementById('selected-gig-banner');
  const selectedGigTitle = document.getElementById('selected-gig-title');
  const applicationForm = document.getElementById('application-form');
  const phoneField = document.getElementById('phone');
  const ageField = document.getElementById('age');
  const dobField = document.getElementById('date-of-birth');
  const phoneError = document.getElementById('phone-error');
  const ageError = document.getElementById('age-error');
  const profilePrefillMessage = document.getElementById('profile-prefill-message');
  const nameField = document.getElementById('name');
  const firstNameField = document.getElementById('first-name');
  const surnameField = document.getElementById('surname');
  const emailField = document.getElementById('email');
  const currentPositionField = document.getElementById('current-position');
  const houseNumberField = document.getElementById('house-number');
  const streetNameField = document.getElementById('street-name');
  const suburbField = document.getElementById('suburb');
  const cityTownField = document.getElementById('city-town');
  const provinceField = document.getElementById('province');
  const postalCodeField = document.getElementById('postal-code');
  const countryField = document.getElementById('country');
  const otherAreaField = document.getElementById('other-area');
  const otherAreaLabel = document.getElementById('other-area-label');
  const skillInput = document.getElementById('skill-input');
  const lettersOnlyRegex = /^[A-Za-zÀ-ÖØ-öø-ÿ' -]+$/;
  const fullNameRegex = /^[A-Za-zÀ-ÖØ-öø-ÿ]+(?:['\-][A-Za-zÀ-ÖØ-öø-ÿ]+)*(?:\s+[A-Za-zÀ-ÖØ-öø-ÿ]+(?:['\-][A-Za-zÀ-ÖØ-öø-ÿ]+)*)*$/;
  const emailRegex = /^[a-z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-z0-9-]+(?:\.[a-z0-9-]+)+$/i;
  const allowedCities = ['Empangeni', 'Richards Bay', 'Esikhaleni', 'Ngwelezane', 'Nseleni', 'Felixton', 'KwaMbonambi', 'Other nearby area'];
  const allowedProvinces = ['Eastern Cape', 'Free State', 'Gauteng', 'KwaZulu-Natal', 'Limpopo', 'Mpumalanga', 'Northern Cape', 'North West', 'Western Cape'];

  function normalizeSouthAfricanPhone(value) {
    const digitsOnly = String(value || '').replace(/\D/g, '');
    if (!digitsOnly) return '';

    let withoutCountryCode = digitsOnly;
    if (withoutCountryCode.startsWith('27')) {
      withoutCountryCode = withoutCountryCode.slice(2);
    } else if (withoutCountryCode.startsWith('0')) {
      withoutCountryCode = withoutCountryCode.slice(1);
    }

    if (withoutCountryCode.length !== 9) {
      return `+27 ${withoutCountryCode}`.trim();
    }

    return `+27 ${withoutCountryCode.slice(0, 2)} ${withoutCountryCode.slice(2, 5)} ${withoutCountryCode.slice(5)}`;
  }

  function isValidSouthAfricanPhone(value) {
    const normalized = normalizeSouthAfricanPhone(value);
    return /^\+27\s\d{2}\s\d{3}\s\d{4}$/.test(normalized);
  }

  function getMinimumBirthDate() {
    const minDate = new Date();
    minDate.setFullYear(minDate.getFullYear() - 17);
    return minDate;
  }

  function calculateAge(dobValue) {
    if (!dobValue) return null;
    const birthDate = new Date(`${dobValue}T00:00:00`);
    if (Number.isNaN(birthDate.getTime())) return null;
    const today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    if (today.getMonth() < birthDate.getMonth() || (today.getMonth() === birthDate.getMonth() && today.getDate() < birthDate.getDate())) age--;
    return age;
  }

  function isValidAgeFromDob(dobValue) {
    const age = calculateAge(dobValue);
    return age !== null && age >= 17;
  }

  function isValidAge(value) {
    const numericAge = Number(value);
    return Number.isInteger(numericAge) && numericAge >= 17;
  }

  function sanitizeLettersOnly(value, fallback = '') {
    if (!value) return fallback;
    const cleaned = value.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ' -]/g, '');
    return cleaned.trim();
  }

  function sanitizeAddressText(value, fallback = '') {
    if (!value) return fallback;
    const cleaned = value.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ0-9' .\-/]/g, '');
    return cleaned.trim();
  }

  function sanitizeEmail(value) {
    if (!value) return '';
    return value.replace(/\s+/g, '').trim();
  }

  function buildPostalAddress() {
    const parts = [
      houseNumberField ? houseNumberField.value.trim() : '',
      streetNameField ? streetNameField.value.trim() : '',
      suburbField ? suburbField.value.trim() : '',
      cityTownField && cityTownField.value === 'Other nearby area'
        ? (otherAreaField ? otherAreaField.value.trim() : '')
        : cityTownField ? cityTownField.value.trim() : '',
      provinceField ? provinceField.value.trim() : '',
      postalCodeField ? postalCodeField.value.trim() : '',
      countryField ? countryField.value.trim() : ''
    ].filter(Boolean);

    return parts.join(', ');
  }

  function isValidPostalCode(value) {
    return /^\d{4}$/.test(String(value || '').trim());
  }

  function isValidAddressField(value, pattern) {
    return !!value && pattern.test(String(value).trim());
  }

  if (nameField) {
    nameField.addEventListener('input', function () {
      const cleaned = sanitizeLettersOnly(this.value);
      if (cleaned !== this.value) {
        this.value = cleaned;
      }
    });
  }

  if (emailField) {
    emailField.addEventListener('input', function () {
      const cleaned = sanitizeEmail(this.value);
      if (cleaned !== this.value) {
        this.value = cleaned;
      }
    });
  }

  if (currentPositionField) {
    currentPositionField.addEventListener('input', function () {
      const cleaned = sanitizeLettersOnly(this.value);
      if (cleaned !== this.value) {
        this.value = cleaned;
      }
    });
  }

  if (skillInput) {
    skillInput.addEventListener('input', function () {
      this.value = sanitizeLettersOnly(this.value);
    });
  }

  if (houseNumberField) {
    houseNumberField.addEventListener('input', function () {
      this.value = sanitizeAddressText(this.value);
    });
  }

  if (streetNameField) {
    streetNameField.addEventListener('input', function () {
      this.value = sanitizeAddressText(this.value);
    });
  }

  if (suburbField) {
    suburbField.addEventListener('input', function () {
      this.value = sanitizeLettersOnly(this.value);
    });
  }

  if (cityTownField) {
    const updateOtherArea = function () {
      const needsOtherArea = this.value === 'Other nearby area';
      if (otherAreaField) {
        otherAreaField.hidden = !needsOtherArea;
        otherAreaField.required = needsOtherArea;
      }
      if (otherAreaLabel) otherAreaLabel.hidden = !needsOtherArea;
      if (!allowedCities.includes(this.value)) {
        this.setCustomValidity('Choose a supported nearby area.');
      } else {
        this.setCustomValidity('');
      }
    };
    cityTownField.addEventListener('change', updateOtherArea);
    updateOtherArea.call(cityTownField);
  }

  if (postalCodeField) {
    postalCodeField.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '').slice(0, 4);
    });
  }

  if (dobField) {
    const minimumBirthDate = getMinimumBirthDate();
    dobField.max = minimumBirthDate.toISOString().split('T')[0];

    dobField.addEventListener('change', function () {
      const dobValue = this.value;
      this.setCustomValidity(dobValue && !isValidAgeFromDob(dobValue) ? 'Applicants must be 17 years or older.' : '');
      if (ageField) ageField.value = calculateAge(dobValue) ?? '';
    });
  }

  if (phoneField) {
    phoneField.addEventListener('input', function () {
      const digitsOnly = String(this.value || '').replace(/\D/g, '');
      if (digitsOnly.length >= 1) {
        const normalized = normalizeSouthAfricanPhone(digitsOnly);
        if (normalized) {
          this.value = normalized;
        }
      }
      if (phoneError) {
        phoneError.style.display = 'none';
      }
    });
  }

  if (ageField) {
    ageField.addEventListener('input', function () {
      if (ageError) {
        ageError.style.display = 'none';
      }
      if (this.value && !isValidAge(this.value)) {
        this.setCustomValidity('Age must be between 17 and 100.');
      } else {
        this.setCustomValidity('');
      }
    });
  }

  if (selectedGig && selectedGig.title && selectedGigBanner && selectedGigTitle) {
      selectedGigTitle.textContent = selectedGig.title;
      selectedGigBanner.style.display = 'block';

      if (currentPositionField) {
        currentPositionField.value = selectedGig.title;
      }
  }

  const currentUser = JSON.parse(localStorage.getItem('campusgig-current-user') || '{}');
  const profileLoad = (async () => {
    if (currentUser.role !== 'student' || !currentUser.id) return;
    const submitButton = applicationForm.querySelector('[type="submit"]');
    if (submitButton) submitButton.disabled = true;
    try {
      const response = await fetch(`https://campusgig-jf2e.onrender.com/api/students/profile?id=${encodeURIComponent(currentUser.id)}`, { cache: 'no-store' });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Could not load your registered student details.');
      const profile = data.student;
      const fields = {
        'first-name': profile.firstName,
        surname: profile.surname,
        'date-of-birth': profile.dateOfBirth,
        email: profile.email,
        phone: profile.phone ? normalizeSouthAfricanPhone(profile.phone) : '',
        'house-number': profile.houseNumber,
        'street-name': profile.streetName,
        suburb: profile.suburb,
        'city-town': profile.cityTown,
        'other-area': profile.otherArea,
        province: profile.province,
        'postal-code': profile.postalCode,
        country: profile.country,
        age: profile.age,
        Gender: profile.gender,
        University: profile.university,
        language: Array.isArray(profile.languages) ? profile.languages.join(', ') : ''
      };
      for (const [id, value] of Object.entries(fields)) {
        const field = document.getElementById(id);
        if (field && value != null) field.value = value;
      }
      if (cityTownField) cityTownField.dispatchEvent(new Event('change'));
    } catch (error) {
      if (profilePrefillMessage) profilePrefillMessage.textContent = `${error.message} Please enter your details manually.`;
    } finally {
      if (submitButton) submitButton.disabled = false;
    }
  })();

  if (applicationForm) {
    applicationForm.addEventListener('submit', async function(event) {
      event.preventDefault();
      await profileLoad;

      const phoneValue = phoneField ? phoneField.value.trim() : '';
      const ageValue = ageField ? ageField.value.trim() : '';
      const firstName = firstNameField ? firstNameField.value.trim() : '';
      const surname = surnameField ? surnameField.value.trim() : '';
      const fullName = [firstName, surname].filter(Boolean).join(' ');
      const emailValue = emailField ? emailField.value.trim() : '';
      const jobTitle = currentPositionField ? currentPositionField.value.trim() : '';
      const streetNumberValue = houseNumberField ? houseNumberField.value.trim() : '';
      const streetNameValue = streetNameField ? streetNameField.value.trim() : '';
      const suburbValue = suburbField ? suburbField.value.trim() : '';
      const cityTownValue = cityTownField ? cityTownField.value.trim() : '';
      const provinceValue = provinceField ? provinceField.value.trim() : '';
      const postalCodeValue = postalCodeField ? postalCodeField.value.trim() : '';
      const countryValue = countryField ? countryField.value.trim() : '';
      let isValid = true;

      if (nameField) nameField.value = fullName;

      const firstNamePattern = /^[\p{L}][\p{L}\p{M}' -]*$/u;
      const surnamePattern = /^[\p{L}][\p{L}\p{M}' -]*$/u;

      if (!firstNamePattern.test(firstName)) {
        firstNameField.setCustomValidity('Please enter a valid first name.');
        firstNameField.reportValidity();
        isValid = false;
      } else firstNameField.setCustomValidity('');

      if (!surnamePattern.test(surname)) {
        surnameField.setCustomValidity('Please enter a valid surname.');
        surnameField.reportValidity();
        isValid = false;
      } else surnameField.setCustomValidity('');

      if (!emailRegex.test(emailValue)) {
        emailField.setCustomValidity('Enter a valid email address.');
        emailField.reportValidity();
        isValid = false;
      } else emailField.setCustomValidity('');

      if (!isValidSouthAfricanPhone(phoneValue)) {
        if (phoneError) phoneError.style.display = 'block';
        isValid = false;
      }

      if (!isValidAge(ageValue) || !isValidAgeFromDob(dobField ? dobField.value : '')) {
        if (ageError) ageError.style.display = 'block';
        isValid = false;
      }

      if (!lettersOnlyRegex.test(jobTitle)) {
        currentPositionField.setCustomValidity('Job title can only contain letters and spaces.');
        currentPositionField.reportValidity();
        isValid = false;
      } else currentPositionField.setCustomValidity('');

      const addressPatterns = {
        houseNumber: /.+/,
        streetName: /.+/,
        suburb: /.+/,
        cityTown: new RegExp(`^(?:${allowedCities.map(city => city.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})$`),
        province: new RegExp(`^(?:${allowedProvinces.join('|')})$`),
        postalCode: /^\d{4}$/,
        country: /^South Africa$/
      };

      [
        { field: houseNumberField, value: streetNumberValue, pattern: addressPatterns.houseNumber, message: 'House/Street Number is required.' },
        { field: streetNameField, value: streetNameValue, pattern: addressPatterns.streetName, message: 'Street Name is required.' },
        { field: suburbField, value: suburbValue, pattern: addressPatterns.suburb, message: 'Suburb is required.' },
        { field: cityTownField, value: cityTownValue, pattern: addressPatterns.cityTown, message: 'City/Town must be Empangeni or Richards Bay.' },
        { field: provinceField, value: provinceValue, pattern: addressPatterns.province, message: 'Province must be KwaZulu-Natal.' },
        { field: postalCodeField, value: postalCodeValue, pattern: addressPatterns.postalCode, message: 'Postal Code must be exactly 4 numbers.' },
        { field: countryField, value: countryValue, pattern: addressPatterns.country, message: 'Country must be South Africa.' }
      ].forEach(({ field, value, pattern, message }) => {
        if (!field) return;
        const valid = pattern.test(value);
        field.setCustomValidity(valid ? '' : message);
        if (!valid) {
          field.reportValidity();
          isValid = false;
        }
      });

      const skillList = (hiddenField.value || '').split(',').map((skill) => skill.trim()).filter(Boolean);
      const invalidSkills = skillList.some((skill) => !lettersOnlyRegex.test(skill));
      if (invalidSkills) {
        skillInput.setCustomValidity('Skills must contain letters and spaces only.');
        skillInput.reportValidity();
        isValid = false;
      } else skillInput.setCustomValidity('');

      if (!isValid) return;

      const formData = new FormData(applicationForm);
      const timetableFile = document.getElementById('timetable-upload')?.files?.[0];
      const currentUser = JSON.parse(localStorage.getItem('campusgig-current-user') || '{}');

      const application = {
        jobId: selectedGig.id || '',
        name: formData.get('name') || fullName,
        dateOfBirth: formData.get('dateOfBirth') || '',
        email: formData.get('email') || emailValue || currentUser.email || '',
        phone: normalizeSouthAfricanPhone(phoneValue),
        postalAddress: buildPostalAddress(),
        houseNumber: formData.get('houseNumber') || '',
        streetName: formData.get('streetName') || '',
        suburb: formData.get('suburb') || '',
        cityTown: formData.get('cityTown') || '',
        province: formData.get('province') || '',
        postalCode: formData.get('postalCode') || '',
        country: formData.get('country') || '',
        age: Number(ageValue),
        gender: formData.get('Gender') || '',
        university: formData.get('University') || currentUser.university || '',
        currentPosition: selectedGig.title || formData.get('currentPosition') || '',
        language: formData.get('language') || '',
        skills: skillList,
        timetableFileName: timetableFile ? timetableFile.name : 'No timetable uploaded',
        availabilityNote: formData.get('availabilityNote') || '',
        gigTitle: selectedGig.title || jobTitle || 'Unspecified gig',
        submittedAt: new Date().toISOString(),
        status: 'Submitted'
      };

      if (!application.jobId) {
        alert('This gig is no longer available. Please return to Browse Gigs and select it again.');
        return;
      }

      try {
        const response = await fetch('https://campusgig-jf2e.onrender.com/api/applications', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(application)
        });
        const data = await response.json();

        if (!response.ok) {
          alert(data.message || 'Could not submit application.');
          return;
        }

        const savedApplications = JSON.parse(localStorage.getItem('campusgig-applications') || '[]');
        savedApplications.push(data.application || application);
        localStorage.setItem('campusgig-applications', JSON.stringify(savedApplications));
        localStorage.removeItem('campusgig-selected-job');
        window.location.href = 'Student.html#applications';
      } catch (error) {
        alert('Could not connect to the CampusGig server. Make sure the backend is running on port 3000.');
      }
    });
  }</script>
</body>
</html>
